<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BNB Treasure Hunt</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;margin:0;padding:20px;text-align:center}
.card{max-width:720px;margin:auto;background:white;padding:20px;border-radius:18px;box-shadow:0 8px 30px #0001}
#game{height:480px;border:2px dashed #bbb;border-radius:14px;position:relative;overflow:hidden;background:#eef5ff}
#treasure{position:absolute;font-size:42px;border:0;background:transparent;cursor:pointer;display:none}
button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
#start{background:#f0b90b;color:#111}.stats{display:flex;justify-content:space-around;margin:14px 0;font-weight:700}
#status{min-height:28px;margin:10px}
</style>
</head>
<body>
<div class="card">
<h1>💎 BNB Treasure Hunt</h1>
<p>Click the treasure as many times as possible in 30 seconds.</p>
<div class="stats">
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="time">30</span>s</div>
<div>Wallet: <span id="wallet">Not connected</span></div>
</div>
<button id="connect">Connect Wallet</button>
<button id="start">Start Game</button>
<div id="status"></div>
<div id="game"><button id="treasure">💎</button></div>
</div>
<script>
let score=0,time=30,running=false,timer;
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');
const treasure=document.querySelector('#treasure'),game=document.querySelector('#game');
const statusEl=document.querySelector('#status'),walletEl=document.querySelector('#wallet');

document.querySelector('#connect').onclick=async()=>{
 if(!window.ethereum){statusEl.textContent='Install/open a wallet with browser support first.';return}
 try{
  const accounts=await ethereum.request({method:'eth_requestAccounts'});
  walletEl.textContent=accounts[0].slice(0,6)+'…'+accounts[0].slice(-4);
  statusEl.textContent='Wallet connected. No transaction was made.';
 }catch(e){statusEl.textContent='Wallet connection cancelled.'}
};

function moveTreasure(){
 const maxX=game.clientWidth-60,maxY=game.clientHeight-60;
 treasure.style.left=Math.max(5,Math.random()*maxX)+'px';
 treasure.style.top=Math.max(5,Math.random()*maxY)+'px';
}
treasure.onclick=()=>{
 if(!running)return;
 score++;scoreEl.textContent=score;moveTreasure();
};
document.querySelector('#start').onclick=()=>{
 if(running)return;
 score=0;time=30;running=true;
 scoreEl.textContent=score;timeEl.textContent=time;
 statusEl.textContent='Go!';
 treasure.style.display='block';moveTreasure();
 clearInterval(timer);
 timer=setInterval(()=>{
  time--;timeEl.textContent=time;
  if(time<=0){
   clearInterval(timer);running=false;treasure.style.display='none';
   statusEl.textContent=`Game over! Score: ${score}. Reward claim can be connected to a smart contract later.`;
  }
 },1000);
};
</script>
</body>
</html>
